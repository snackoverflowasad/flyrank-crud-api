<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-bg { fill: #0f172a; }
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 8; }
      .badge-get { fill: #3b82f6; rx: 4; }
      .badge-post { fill: #10b981; rx: 4; }
      .badge-put { fill: #f59e0b; rx: 4; }
      .badge-delete { fill: #ef4444; rx: 4; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 20px; fill: #ffffff; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .text-method { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; fill: #ffffff; text-anchor: middle; }
      .text-path { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; font-weight: 600; fill: #1e293b; }
      .text-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .text-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #059669; }
    </style>
  </defs>

  <rect width="900" height="640" class="bg" />

  <rect width="900" height="80" class="header-bg" />
  <text x="32" y="42" class="text-title">Task Management API - Swagger UI</text>
  <text x="32" y="62" class="text-subtitle">[ OpenAPI 3.0.3 ]  http://localhost:3000/docs  |  OAS Definition: openapi.json</text>

  <g transform="translate(32, 100)">
    <rect width="836" height="52" class="card-bg" />
    <rect x="12" y="12" width="64" height="28" class="badge-get" />
    <text x="44" y="30" class="text-method">GET</text>
    <text x="90" y="31" class="text-path">/</text>
    <text x="280" y="31" class="text-desc">Root API Information &amp; Entry Points</text>
    <text x="760" y="31" class="text-code">200 OK</text>
  </g>

  <g transform="translate(32, 162)">
    <rect width="836" height="52" class="card-bg" />
    <rect x="12" y="12" width="64" height="28" class="badge-get" />
    <text x="44" y="30" class="text-method">GET</text>
    <text x="90" y="31" class="text-path">/health</text>
    <text x="280" y="31" class="text-desc">Service Health Check Status</text>
    <text x="760" y="31" class="text-code">200 OK</text>
  </g>

  <g transform="translate(32, 224)">
    <rect width="836" height="52" class="card-bg" />
    <rect x="12" y="12" width="64" height="28" class="badge-get" />
    <text x="44" y="30" class="text-method">GET</text>
    <text x="90" y="31" class="text-path">/tasks</text>
    <text x="280" y="31" class="text-desc">List All Tasks (?done=true, ?search=...)</text>
    <text x="760" y="31" class="text-code">200 OK</text>
  </g>

  <g transform="translate(32, 286)">
    <rect width="836" height="52" class="card-bg" />
    <rect x="12" y="12" width="64" height="28" class="badge-post" />
    <text x="44" y="30" class="text-method">POST</text>
    <text x="90" y="31" class="text-path">/tasks</text>
    <text x="280" y="31" class="text-desc">Create New Task with Input Validation</text>
    <text x="740" y="31" class="text-code">201 Created</text>
  </g>

  <g transform="translate(32, 348)">
    <rect width="836" height="52" class="card-bg" />
    <rect x="12" y="12" width="64" height="28" class="badge-get" />
    <text x="44" y="30" class="text-method">GET</text>
    <text x="90" y="31" class="text-path">/tasks/{id}</text>
    <text x="280" y="31" class="text-desc">Fetch Task Record By Numerical ID</text>
    <text x="735" y="31" class="text-code">200 / 404</text>
  </g>

  <g transform="translate(32, 410)">
    <rect width="836" height="52" class="card-bg" />
    <rect x="12" y="12" width="64" height="28" class="badge-put" />
    <text x="44" y="30" class="text-method">PUT</text>
    <text x="90" y="31" class="text-path">/tasks/{id}</text>
    <text x="280" y="31" class="text-desc">Update Task Title or Completion Status</text>
    <text x="710" y="31" class="text-code">200 / 400 / 404</text>
  </g>

  <g transform="translate(32, 472)">
    <rect width="836" height="52" class="card-bg" />
    <rect x="12" y="12" width="64" height="28" class="badge-delete" />
    <text x="44" y="30" class="text-method">DELETE</text>
    <text x="90" y="31" class="text-path">/tasks/{id}</text>
    <text x="280" y="31" class="text-desc">Remove Task From In-Memory Storage</text>
    <text x="735" y="31" class="text-code">204 / 404</text>
  </g>

  <g transform="translate(32, 534)">
    <rect width="836" height="52" class="card-bg" />
    <rect x="12" y="12" width="64" height="28" class="badge-get" />
    <text x="44" y="30" class="text-method">GET</text>
    <text x="90" y="31" class="text-path">/stats</text>
    <text x="280" y="31" class="text-desc">Aggregate Metrics: Total, Done, Open</text>
    <text x="760" y="31" class="text-code">200 OK</text>
  </g>
</svg>
